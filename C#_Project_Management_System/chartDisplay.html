<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .container {
            width: 50%;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1, h3 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin: 10px 0;
            font-weight: bold;
        }

        select, input {
            width: 100%;
            padding: 10px;
            margin: 5px 0 20px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #5cb85c;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
        }

            button:hover {
                background-color: #4cae4c;
                cursor:pointer;
            }

        @media (max-width: 600px) {
            .container {
                width: 95%;
            }
        }

        @media print {
            body {
                margin: 10px;
            }

            .container {
                width: 100%;
                margin-left: 0;
                background: white;
                /* padding: 20px; */
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }

            .printOut,
            .btn {
                display: none;
            }

            #taskChart {
                background-color: white !important;
                /* Ensure the background color is white */
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>SDLC Model and Task Chart</h1>
        <div id="diagram"></div>
        <canvas id="taskChart" width="400" height="400"></canvas>
        <div id="details"></div> <!-- Section for showing detailed information -->
        <button onclick="window.location.href='afterLogin.aspx'" class="btn">Go Back</button>
        <button onclick="printCard()" class="btn">Print</button>
    </div>

    <script>
       
        window.onload = function () {
            displayData();
        };

        function displayData() {
            const savedData = JSON.parse(localStorage.getItem('sdlcData'));
            if (savedData) {
                // Show SDLC model name
                const diagramDiv = document.getElementById('diagram');
                const modelTitle = document.createElement('h2');
                modelTitle.innerText = `Selected SDLC Model: ${savedData.model}`;
                diagramDiv.appendChild(modelTitle);

                // Prepare data for the chart
                const phaseNames = [];
                const daysData = [];
                const teamMembers = [];
                const detailsArray = []; // To store detailed information for each phase

                for (const [phase, details] of Object.entries(savedData.phases)) {
                    phaseNames.push(phase);
                    daysData.push(details.days);
                    teamMembers.push(details.member); // Assuming 'member' field contains the person assigned

                    // Collect details for the phase
                    detailsArray.push({
                        phase: phase,
                        member: details.member,
                        days: details.days,

                    });
                }

                // Display chart using Chart.js
                const ctx = document.getElementById('taskChart').getContext('2d');

                // Set a white background for the canvas
                ctx.canvas.style.backgroundColor = 'white';

                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: phaseNames,
                        datasets: [{
                            label: 'Days per Phase',
                            data: daysData,
                            backgroundColor: 'rgba(75, 192, 192, 0.2)',
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        },
                        plugins: {
                            tooltip: {
                                callbacks: {
                                    label: function (context) {
                                        const index = context.dataIndex;
                                        const days = daysData[index];
                                        const member = teamMembers[index];
                                        return `${phaseNames[index]}: ${days} days (Assigned to: ${member})`;
                                    }
                                }
                            }
                        }
                    }
                });


                // Create a detailed section below the chart
                const detailsDiv = document.getElementById('details');
                const detailsTable = document.createElement('table');
                detailsTable.style.borderCollapse = 'collapse';
                detailsTable.style.width = '100%';
                detailsTable.style.marginTop = '20px';
                detailsTable.style.textAlign = 'left';
                detailsTable.innerHTML = `
                    <thead>
                        <tr>
                            <th style="border: 1px solid #ddd; padding: 8px;">Phase</th>
                            <th style="border: 1px solid #ddd; padding: 8px;">Assigned Member</th>
                            <th style="border: 1px solid #ddd; padding: 8px;">Days Assigned</th>
                            
                        </tr>
                    </thead>
                    <tbody>
                        ${detailsArray.map(detail => `
                            <tr>
                                <td style="border: 1px solid #ddd; padding: 8px;">${detail.phase}</td>
                                <td style="border: 1px solid #ddd; padding: 8px;">${detail.member}</td>
                                <td style="border: 1px solid #ddd; padding: 8px;">${detail.days}</td>
                                
                            </tr>
                        `).join('')}
                    </tbody>
                `;
                detailsDiv.appendChild(detailsTable);
            } else {
                document.getElementById('diagram').innerText = "No data available";
            }
        }
        function printCard() {
            window.print();
        }


    </script>
</body>
</html>
