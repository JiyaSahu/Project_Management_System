<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="CSS/teamDetailsForm.css" rel="stylesheet" />
    
</head>
<body>
    <div class="container">
        <h1>Project Team Members Details Form</h1>
        <form id="sdlcForm">
            <label for="model">Choose SDLC Model:</label>
            <select id="model" name="model">
                <option value="Waterfall">Waterfall</option>
                <option value="Agile">Agile</option>
                <option value="Scrum">Scrum</option>
            </select>

            <h3>Input Team Members Information</h3>
            <div id="phases"></div>
            <button type="submit">Submit</button>
        </form>
    </div>
    <script src="JavaScripts/teamDetailsForm.js"></script>

</body>
</html>
